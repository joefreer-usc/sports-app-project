<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sports Hub</title>
  <meta name="theme-color" content="#08111b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sports Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">YOUR SPORTS. ONE PLACE.</p>
      <h1><button type="button" id="brandHome" aria-label="Go to Sports Hub home">Sports Hub</button></h1>
    </div>
    <div class="header-actions">
      <span id="updated" aria-live="polite"></span>
      <label class="sr-only" for="pageMenu">Choose a page</label>
      <select id="pageMenu" aria-label="Choose a page">
        <option value="" disabled>Menu</option>
        <option value="home">Home</option>
        <option value="live">Live</option>
        <option value="favorites">My Favorites</option>
      </select>
    </div>
  </header>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
